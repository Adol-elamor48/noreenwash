<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- خلفية داكنة ملائمة للحجم المربع -->
  <rect width="512" height="512" fill="#0B0B0B" rx="96"/>
  
  <defs>
    <!-- التدرج الذهبي الفاخر -->
    <linearGradient id="noreenFaviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0AA" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#5B4308" />
    </linearGradient>
  </defs>
  <!-- إمالة الشعار لليمين بمقدار 12 درجة وتوسطه تماماً -->
  <g transform="rotate(12 256 256)">
    <!-- 1. الإطار الذهبي الخارجي -->
    <rect x="76.8" y="76.8" width="358.4" height="358.4" rx="89.6" ry="89.6" fill="url(#noreenFaviconGold)" />
    <!-- 2. الجزء الأسود الداخلي -->
    <rect x="112.64" y="112.64" width="286.72" height="286.72" rx="58.88" ry="58.88" fill="#0E0E0E" />
    <!-- 3. حرف N الذهبي المفرغ -->
    <path fill="url(#noreenFaviconGold)" d="
      M 153.6,358.4 
      L 153.6,153.6 
      L 209.92,153.6 
      L 302.08,291.84 
      L 302.08,153.6 
      L 358.4,153.6 
      L 358.4,358.4 
      L 302.08,358.4 
      L 209.92,220.16 
      L 209.92,358.4 
      Z" />
